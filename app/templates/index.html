{% extends "base.html" %}

{% block content %}

<!-- ========== ГЛАВНАЯ СТРАНИЦА: СТАТИСТИКА И ПОСЛЕДНИЕ СТАТЬИ ========== -->
<section class="dashboard-stats">
    <h2>📊 Статистика</h2>

    <div class="stat-grid">
        <div class="stat-card total">
            <i class="fa-solid fa-layer-group"></i>
            <span class="stat-value" id="stat-total">--</span>
            <span class="stat-label">Всего материалов</span>
        </div>
        <div class="stat-card course">
            <i class="fa-solid fa-book"></i>
            <span class="stat-value" id="stat-courses">--</span>
            <span class="stat-label">Курсы</span>
        </div>
        <div class="stat-card module">
            <i class="fa-solid fa-folder"></i>
            <span class="stat-value" id="stat-modules">--</span>
            <span class="stat-label">Модули</span>
        </div>
        <div class="stat-card topic">
            <i class="fa-solid fa-folder"></i>
            <span class="stat-value" id="stat-topics">--</span>
            <span class="stat-label">Темы</span>
        </div>
        <div class="stat-card article">
            <i class="fa-solid fa-file"></i>
            <span class="stat-value" id="stat-articles">--</span>
            <span class="stat-label">Статьи</span>
        </div>
    </div>

    <div class="tables-grid">
        <div class="table-container">
            <h3>➕ Последние добавленные</h3>
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Тип</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="table-added-body">
                    <tr><td colspan="3"><em>Загрузка...</em></td></tr>
                </tbody>
            </table>
        </div>
        <div class="table-container">
            <h3>✏️ Последние обновленные</h3>
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Тип</th>
                        <th>Дата правки</th>
                    </tr>
                </thead>
                <tbody id="table-updated-body">
                    <tr><td colspan="3"><em>Загрузка...</em></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- Контейнер для последних статей (загружается через AJAX) -->
<div id="articles-container"></div>

{% endblock %}
