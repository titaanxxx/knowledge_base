{% extends "base.html" %}

{% block content %}

<section class="kb-latest">
    <h2>📖 Курсы</h2>
    {% if articles %}
        <ul class="article-list">
            {% for article in articles %}
                <li>
                    <a href="{{ url_for('main.article', slug=article.slug) }}">{{ article.title }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Курсы пока не добавлены.</p>
    {% endif %}
</section>

{% endblock %}
